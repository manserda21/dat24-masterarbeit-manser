[project]
name = "code"
version = "0.1.0"
description = "Master Thesis of Manser Daniel of the 'Data Science and Artificial Intelligence' course "
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=0.9.9",
    "ipykernel>=7.0.1",
    "jupyter>=1.1.1",
    "opencv-python-headless>=4.13.0.92",
    "soccernet>=0.1.62",
    "ultralytics>=8.4.31",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "torchaudio>=2.6.0",
    "pandas>=3.0.2",
    "mpv>=1.0.8",
    "tree>=0.2.4",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
